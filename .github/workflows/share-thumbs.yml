name: Share preview images
# Makes assets/share/<story-id>.jpg (small 1200x630) for each story so
# WhatsApp/Facebook show the story's own photo when a link is shared.
on:
  push:
    branches: [main]
    paths: ["data/news.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: share-thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python scripts/make_share_thumbs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/share
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Share preview images"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
