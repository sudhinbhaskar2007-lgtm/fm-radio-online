name: Check live headlines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -D - -o /tmp/h.json https://mizhinews.co.uk/api/headlines | head -15
          python3 -c "
          import json,collections
          d=json.load(open('/tmp/h.json')); print('updated',d['updated'],'items',len(d['items']))
          print(collections.Counter((i['region'],i['source']) for i in d['items']))
          for i in d['items'][:5]: print(i['region'],i['source'],i['time'],i['title'][:80])"
