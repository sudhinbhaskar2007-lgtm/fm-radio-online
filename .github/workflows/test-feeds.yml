name: Test news feeds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            https://www.thehindu.com/news/national/kerala/feeder/default.rss \
            https://www.thehindu.com/news/national/feeder/default.rss \
            https://feeds.feedburner.com/ndtvnews-india-news \
            https://www.onmanorama.com/news/kerala.feeds.onmrss.xml \
            https://www.onmanorama.com/news/india.feeds.onmrss.xml \
            https://www.manoramaonline.com/news/kerala.feeds.onmrss.xml \
            https://www.manoramaonline.com/news/latest-news.feeds.onmrss.xml \
            https://english.mathrubhumi.com/rss \
            https://www.mathrubhumi.com/rss \
            https://timesofindia.indiatimes.com/rssfeeds/878156304.cms \
            https://timesofindia.indiatimes.com/rssfeeds/-2128936835.cms \
            https://www.newindianexpress.com/states/kerala/rssfeed/?id=178 \
            https://indianexpress.com/section/india/feed/ \
            https://www.deccanchronicle.com/google_feeds.xml \
            https://feeds.bbci.co.uk/news/world/asia/india/rss.xml ; do
            code=$(curl -s -A "Mozilla/5.0 MizhiNewsHeadlines/1.0" -o /tmp/f.xml -w "%{http_code} %{content_type}" -L "$u")
            n=$(grep -o "<item" /tmp/f.xml | wc -l)
            t=$(grep -o "<title>[^<]*</title>\|<title><!\[CDATA\[[^]]*" /tmp/f.xml | sed -n 3p | cut -c1-120)
            echo "FEED $u | $code | items=$n | $t"
          done
