name: Update headlines (fallback)

# Fallback only: every 6 hours, save the headline feeds (headline + link only)
# into data/headlines.json. The live site reads /api/headlines (a Cloudflare
# Pages Function, refreshed every 15 minutes) and uses this file if that fails.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_headlines.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/headlines.json; then echo "No change"; exit 0; fi
          git config user.name "mizhi-headlines-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json
          git commit -m "Update UK headlines"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
