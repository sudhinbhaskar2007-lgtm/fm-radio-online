name: Check link previews
# Manual check: can link-preview bots (WhatsApp, Facebook) download our pages and pictures?
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "WhatsApp/2.24.20.80 A" "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "Mozilla/5.0"; do
            echo "=== UA: $ua"
            for u in "https://mizhinews.co.uk/s/elma-programme-supporting-committee-2026-28?v=9" \
                     "https://mizhinews.co.uk/assets/share/elma-programme-supporting-committee-2026-28.jpg" \
                     "https://mizhinews.co.uk/assets/eye-poster.jpg"; do
              curl -s -o /tmp/out -A "$ua" -w "%{http_code} %{content_type} %{size_download}B  $u\n" "$u"
              head -c 300 /tmp/out | grep -o 'og:image" content="[^"]*"\|cf-chl\|Just a moment\|Attention Required' || true
            done
          done
