name: Deploy to GitHub Pages

# The live site is mizhinews.co.uk on Cloudflare Pages. This old GitHub Pages
# copy now only deploys when run by hand (Actions > Run workflow), so news
# pushes no longer trigger it or send failure emails.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
