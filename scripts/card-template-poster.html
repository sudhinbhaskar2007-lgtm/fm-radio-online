<!doctype html><html><head><meta charset="utf-8">
<!-- Mizhi "poster" card for the main story (Sudhin, 24 Nov): big photo of the person on the left fading into a themed
     background, huge yellow Malayalam headline, second line in red on a yellow brush strip, Mizhi News logo bottom-left.
     Filled in by scripts/poster.py -->
<style>
body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:"Noto Sans Malayalam","Outfit",sans-serif}
.wrap{position:relative;width:1280px;height:720px;overflow:hidden}
svg.bg{position:absolute;inset:0}
.photo{position:absolute;left:0;top:0;width:560px;height:720px;background-size:cover;background-position:center top;
 -webkit-mask-image:linear-gradient(90deg,#000 62%,transparent 100%);mask-image:linear-gradient(90deg,#000 62%,transparent 100%)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35))}
.hl{position:absolute;left:470px;right:36px;top:120px;text-align:center}
.l1{font-weight:900;font-size:64px;line-height:1.18;color:#fff;-webkit-text-stroke:3px #0b1440;paint-order:stroke fill;text-shadow:0 6px 0 #0b1440,0 10px 24px rgba(0,0,0,.5)}
.l2{font-weight:900;font-size:92px;line-height:1.12;color:#ffe11a;-webkit-text-stroke:4px #0b1440;paint-order:stroke fill;text-shadow:0 7px 0 #0b1440,0 12px 30px rgba(0,0,0,.5);margin-top:6px}
.strip{position:absolute;left:60px;right:0;bottom:118px;padding:14px 40px 16px 120px;text-align:center;
 background:#ffe11a;clip-path:polygon(2% 8%,100% 0,98% 92%,0 100%);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.l3{font-weight:900;font-size:54px;line-height:1.15;color:#c4100c}
.en{position:absolute;left:470px;right:36px;bottom:66px;text-align:center;color:#fff;font:700 24px/1.3 "Outfit",sans-serif;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.logo{position:absolute;left:28px;bottom:26px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);padding:8px 16px 8px 10px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.logo b{display:block;font:900 26px/1 "Outfit",sans-serif;background:linear-gradient(90deg,#e0359f,#ff7a1f);-webkit-background-clip:text;color:transparent;letter-spacing:.02em}
.logo small{display:block;font:700 13px/1.3 "Noto Sans Malayalam",sans-serif;color:#222}
.logo i{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#e0359f,#ff9a1f);display:grid;place-items:center;color:#fff;font:900 20px "Outfit";font-style:normal}
.tag{position:absolute;right:16px;bottom:12px;color:#fff;opacity:.85;font:600 14px "Outfit",sans-serif}
.badge{position:absolute;right:30px;top:28px;background:#e3263b;color:#fff;font:800 22px/1 "Outfit","Noto Sans Malayalam",sans-serif;padding:10px 16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
</style></head><body><div class="wrap">
<svg class="bg" viewBox="0 0 1280 720" width="1280" height="720">{{THEME}}</svg>
<div class="photo" style="background-image:url('{{PHOTO}}')"></div>
<div class="badge">{{BADGE}}</div>
<div class="hl"><div class="l1">{{L1}}</div><div class="l2">{{L2}}</div></div>
<div class="strip"><div class="l3">{{L3}}</div></div>

<div class="logo"><i>മി</i><div><b>MIZHI NEWS</b><small>മിഴി യുകെ മലയാളം വാർത്ത</small></div></div>
<div class="tag">File photo · Mizhi News</div>
</div></body></html>
